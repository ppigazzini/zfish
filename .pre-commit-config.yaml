# Pre-commit hooks: file hygiene, Python lint/format/type-check, zig fmt.
# Install once with `pre-commit install`; run everything with
# `pre-commit run --all-files`. CI does not run these -- the parity workflow's
# own gates (zig fmt --check first) stay the authority; this catches the same
# classes before the commit exists.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # Never touch byte-exact comparison inputs: goldens are matched against
        # engine output verbatim (misc.golden carries a trailing space today),
        # .epd/.nnue are data, and a .patch is a diff whose context lines begin
        # with a space -- stripping that is how a patch silently stops applying.
        exclude: '\.(golden|epd|nnue|patch)$'
      - id: trailing-whitespace
        exclude: '\.(golden|epd|nnue|patch)$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.65
    hooks:
      # The hook's own entry checks the whole project (ty's cross-file
      # diagnostics make per-filename invocation wrong); tools/ is the only
      # Python in the tree, and [tool.ty] in pyproject.toml pins the env.
      - id: ty
  # 25 hand-written bash scripts decide most of what this repo claims, and until this
  # landed nothing had read them. The config below already lints, formats and type-checks
  # the Python; the language the GATES are written in had nothing -- and a gate with a bug
  # reports success, which is the failure mode AGENTS.md names first.
  #
  # Severity is `warning`, held at zero, NOT `style`. The style class here is 22 findings
  # dominated by SC2016 (awk and grep programs in single quotes, where `$1` is awk's field
  # and expansion would be the bug) and SC2086 (word splitting that several tools rely on).
  # Each needs a judgement, and a gate that invites mechanical fixes to those is a gate that
  # breaks tools: the first `warning` fix here, perf_callgrind.sh, had a default argument
  # and an unquoted expansion that were load-bearing for EACH OTHER, so quoting it alone
  # would have passed `bench "16 1 11"` as one argv element.
  #
  # Its first run found five, three of them the same class in gate drivers -- a `cd` with no
  # `|| exit`, which leaves the gate running in the caller's directory.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
  - repo: local
    hooks:
      # zig fmt is CI's first gate and blocks everything after it; run it on the
      # staged .zig files here so a deletion's leftover blank line never reaches
      # CI. Local hook, not a wrapper repo: the entry is one pinned-toolchain
      # command, and a third-party mirror would add a supply-chain edge for it.
      - id: zig-fmt
        name: zig fmt --check
        entry: zig fmt --check
        language: system
        types: [zig]
      # Docs are part of the change (AGENTS.md): a doc edit that breaks a link,
      # names a dead path, or contradicts the bench anchor should fail here, not
      # in CI.
      - id: docs-lint
        name: zig build docs-lint
        entry: zig build docs-lint
        language: system
        files: '\.md$'
        pass_filenames: false
