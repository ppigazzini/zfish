# Scheduled upstream-sync detection and map health.
#
# Two halves. DETECTION is judgment-free: fetch official-stockfish/master and
# print how many commits the port is behind its UPSTREAM_BASE marker, so a
# net-format / bench change can't silently bundle up between sessions. Porting
# stays a deliberate, human-gated session -- that half only detects, it never
# attempts a port. The GATING half runs `zig build upstream-map` -- the
# declared-vs-derived map audit (rot fails) plus the uncovered-surface ratchet
# -- which the parity workflow cannot run because a plain checkout of origin
# does not carry the pinned upstream tree; here the detection half's fetch of
# the upstream remote has already brought those objects in.
name: zfish upstream check

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Upstream master moves a few commits a week; the
    # rule is "sync at least at every net bump", and weekly detection is
    # cheap insurance against one slipping through.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Least privilege: detection only reads the repository and upstream history.
permissions:
  contents: read

jobs:
  upstream-check:
    name: Detect upstream drift
    runs-on: ubuntu-latest
    # Detection and the map audit are seconds. The walk step dominates: on a cold cache it
    # builds the oracle from source and downloads two nets (~50 MB ours, ~90 MB upstream's)
    # before searching anything. The search itself is ~6 s for 40 positions at depth 13.
    timeout-minutes: 30
    steps:
      # Full history so `git rev-list BASE..upstream/master` can count the gap
      # (a shallow checkout may not contain UPSTREAM_BASE).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The sync driver fetches from a remote named `upstream`; add it here (the
      # local dev clone adds it separately, CI adds its own).
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/official-stockfish/Stockfish.git

      # upstream_sync.sh --check fetches upstream/master, computes the behind-
      # count from UPSTREAM_BASE, and prints one terse line. Always exits 0 --
      # this is informational, not a gate. Surface the line in the job summary.
      - name: Detect upstream drift
        run: |
          line="$(bash tools/upstream_sync.sh --check)"
          echo "$line"
          {
            echo "## Upstream drift"
            echo ""
            echo "\`$line\`"
            echo ""
            echo "Porting is human-gated: run \`tools/upstream_sync.sh\` locally for the worklist."
          } >> "$GITHUB_STEP_SUMMARY"

      # pyproject.toml declares requires-python >= 3.14; run the tools on what
      # they declare, not on whatever python3 the runner image ships.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The map gate proper. The drift step's fetch pulled the upstream remote's
      # objects into this clone, so the pinned tree at UPSTREAM_TARGET is now
      # readable and the audit runs exactly as it does locally: declared-map rot
      # fails, drift is advisory, and the uncovered count is ratcheted against
      # tools/upstream/upstream_map.baseline. This one IS a gate -- a red run
      # means the blast-radius map no longer matches the tree.
      - name: Audit the upstream map (rot + ratchet)
        run: |
          # Capture without tripping `bash -e` on a red audit: the summary must
          # publish exactly when the gate fails.
          #
          # Through the STEP, not through `python3 tools/upstream_map_derive.py --audit`
          # directly: the step is that command and nothing else, so running the script here
          # made two paths to one answer -- which is how they drift, and it had already left
          # this workflow's own comment above claiming a step it did not dispatch. Verified
          # byte-identical output and exit status before the switch.
          if out="$(zig build upstream-map)"; then
            status=0
          else
            status=$?
          fi
          echo "$out"
          {
            echo "## Upstream map audit"
            echo ""
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Installs Zig 0.16.0 and caches the build cache. Needed for two things here:
      # the zfish binary under test, and tools/zigcxx -- the oracle compiles with ZIG
      # C++ so both sides share one LLVM backend.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The random-walk fidelity gate. The bench anchor covers a FIXED position list, so
      # a port can be nudged toward that number without becoming faithful; this reaches
      # positions by playing random legal moves from the start, so they are in no bench
      # list, no golden and no test, and diffs both engines' node counts PER DEPTH.
      #
      # It lives in this workflow and not in parity for the same reason the map audit
      # does: it needs the pinned upstream tree, which a plain checkout of origin does
      # not carry and the drift step's fetch has already brought in. The step builds the
      # oracle itself (a detached worktree at UPSTREAM_TARGET); point it at the runner's
      # temp dir, since the script's default is a developer-machine path.
      #
      # The seed is FIXED, not the wall clock: a red weekly run has to be reproducible
      # from the log with one flag. Widening coverage is --positions, not a fresh seed.
      - name: Node-for-node vs upstream over a random walk
        env:
          ZFISH_ORACLE_DIR: ${{ runner.temp }}/zfish-upstream-oracle
        run: |
          if out="$(zig build upstream-walk -Dwalk-args="--positions 40 --depth 13" 2>&1)"; then
            status=0
          else
            status=$?
          fi
          echo "$out"
          {
            echo "## Random-walk node parity"
            echo ""
            echo '```'
            echo "$out" | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Prove every committed golden is what UPSTREAM produces, not merely what we produce.
      # A golden is a photograph of ourselves, so `<gate>-update` on a red gate pins whatever
      # the binary currently does -- bug included -- and nothing downstream can tell the
      # difference afterwards. The audit re-runs each gate's check with the pristine oracle
      # substituted for our binary, which is only possible because every golden is built from
      # UCI-observable behaviour and parity_harness takes the engine as an argument.
      #
      # It belongs in THIS workflow, beside the map audit and the random walk, for the same
      # reason they do: it needs the pinned upstream tree that the drift step's fetch brought
      # in, and it builds the oracle, which the parity lane deliberately does not.
      #
      # `zig build tb-init` first, to populate resources/ -- it pulls the net and the 3-man
      # Syzygy set, and the audit runs every gate from that directory (the tablebase gates
      # resolve `SyzygyPath value syzygy` relative to it; run them anywhere else and they
      # report with-tb == no-tb, which reads as a divergence and is not one).
      #
      # tb-cursed is skipped BY NAME, not by listing the other twenty: it needs the 5-man
      # tables no CI lane fetches, and --skip keeps picking up gates added later, where a
      # positional list would quietly stop covering them. It stays a local-only gate --
      # docs/10-tooling-ci.md records that those go stale silently and must be run by hand
      # each sync.
      - name: Adjudicate the goldens against the pristine oracle
        env:
          ZFISH_ORACLE_DIR: ${{ runner.temp }}/zfish-upstream-oracle
        run: |
          zig build tb-init
          if out="$(bash tools/upstream_golden_audit.sh --skip tb-cursed 2>&1)"; then
            status=0
          else
            status=$?
          fi
          echo "$out"
          {
            echo "## Golden adjudication vs upstream"
            echo ""
            echo '```'
            echo "$out" | tail -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The tools no lane invokes. `lane-coverage` holds every BUILD STEP to a lane; this is
      # the same question one level down, for the tools that are not build steps at all. A
      # tool nobody runs rots silently -- it sits in tools/ looking maintained -- and one of
      # the six had: `upstream_net.sh` was copying 91 MB into every worktree's `src/`, the
      # location the net left when zfish moved to loading it from `resources/`.
      #
      # It belongs in THIS workflow because three of its four rows read the pinned upstream
      # tree out of git objects (the re-port worklist, the router's backlog, the bench map),
      # which the drift step's fetch above has already brought in and a plain origin checkout
      # does not carry. It runs no engine and builds nothing.
      - name: Smoke the tools no lane invokes
        run: bash tools/tools_smoke.sh

      # The finish line: our default build's bench against the PRISTINE oracle's, one number
      # carrying the whole claim of this port. It ran when a human remembered, which is not a
      # lane -- and it is the LAST gate anyone would choose to leave un-dispatched.
      #
      # `signature` pins that number against a committed golden, so the two answer different
      # questions: signature says "the tree still benches what it benched", upstream-parity
      # says "what it benches is what UPSTREAM benches". A resync that moved the anchor and
      # re-blessed the golden keeps signature green by construction; only this gate can tell
      # you the new number is upstream's.
      #
      # Here rather than in `parity` for the reason docs/09 gives: it needs a full pristine
      # upstream build, which the per-push lane deliberately does not do. By this point in the
      # job the oracle is already built and the net already fetched, so it costs a bench.
      - name: Assert the bench equals the pristine oracle
        env:
          ZFISH_ORACLE_DIR: ${{ runner.temp }}/zfish-upstream-oracle
        run: |
          if out="$(zig build upstream-parity 2>&1)"; then
            status=0
          else
            status=$?
          fi
          echo "$out"
          {
            echo "## Bench vs the pristine oracle"
            echo ""
            echo '```'
            echo "$out" | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Assert zfish CALLS what upstream calls, as often -- the only check here that can see
      # a state divergence which does not move a node count.
      #
      # Every other differential in this repo compares VALUES: the bench anchor, the UCI
      # goldens, arch-determinism, the random-position node differential above. Each one
      # passes over a defect that happens not to change a node count on the positions it
      # drives. The sibling C port had two real bugs living behind exactly that all-green
      # wall -- a `ucinewgame` that discarded the position, and a mate/stalemate root that
      # skipped the per-worker reset -- and BOTH surfaced as one call of difference in
      # set_check_info. zfish has neither, and this is what proves that rather than someone
      # having read two files carefully.
      #
      # It belongs in THIS workflow for the same reason the map audit and the random walk
      # do: it needs the pinned upstream tree the drift step's fetch brought in, and it
      # builds the oracle. It runs under callgrind at ~50x, which is why it is not in
      # `zig build parity` -- but callgrind SIMULATES rather than samples, so unlike every
      # cycles reading here the result is deterministic and a loaded runner cannot flap it.
      - name: Call-count fingerprint vs upstream
        env:
          ZFISH_ORACLE_DIR: ${{ runner.temp }}/zfish-upstream-oracle
        run: |
          # Refresh the index first: the runner image ships a stale one, and apt 404s
          # on a libc6-dbg the mirror has already superseded (exit 100, before the gate
          # below ever runs). zfish_parity.yml's valgrind step pairs them for this reason.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          if out="$(bash tools/upstream_fingerprint.sh 2>&1)"; then
            status=0
          else
            status=$?
          fi
          echo "$out"
          {
            echo "## Call-count fingerprint vs upstream"
            echo ""
            echo '```'
            echo "$out" | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
