# Nightly coverage-guided fuzzing.
#
# The `zig build fuzz` SMOKE (one iteration per target) runs on every push inside
# the parity workflow; this job runs the CONTINUOUS Zig fuzzer for a bounded budget
# each night. It mutates toward new coverage over ALL THREE fuzz roots -- the
# FEN-parse -> generateLegal -> make/unmake -> eval -> search targets
# (src/engine/board/fuzz_targets.zig, step `fuzz-board`), the Syzygy file parse as units
# (src/platform/syzygy/fuzz_targets.zig, step `fuzz-tb`) and the same parse driven end to
# end through a probe (src/platform/syzygy/fuzz_probe.zig, step `fuzz-tb-probe`) -- each
# on its OWN per-target step, for the slot reason spelled out at that step. All are built
# under -Doptimize=ReleaseSafe so a discovered input that trips a Zig safety check --
# out-of-bounds, integer overflow, pointer misalignment, null-unwrap -- crashes the run
# with the reproducer instead of reading garbage. The fuzzer catches such bugs before they
# reach the bench/parity goldens.
#
# A clean run means "no crash was FOUND in that budget", which is only worth
# publishing if the budget was actually spent: see the execution-counter gate at the
# end of the fuzz job.
name: zfish fuzz (nightly)

on:
  schedule:
    # 04:17 UTC daily -- off the hour to dodge the scheduler's peak.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    name: Continuous fuzz (bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The fuzz targets call position.initRuntime() which needs the NNUE net on
      # disk (same cache key as the parity workflow -- a Zig-only net bump busts it).
      - name: Cache NNUE network
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/nn-*.nnue
          key: nnue-${{ hashFiles('src/engine/eval/network.zig') }}
      - name: Fetch the NNUE net
        run: zig build net

      # Record each artifact's execution counter BEFORE the run. The counters in
      # .zig-cache/v are cumulative, so the gate below diffs against this to measure
      # what THIS run did. An absent file (fresh checkout) reads as all-zero, which
      # is the right baseline.
      - name: Snapshot the fuzzer's execution counters
        run: zig run tools/fuzz_report.zig -- .zig-cache snapshot /tmp/fuzz-baseline.txt

      # Fuzz each artifact in ITS OWN session, ~5 min each, rather than one 15-min
      # `zig build fuzz --fuzz` over all three.
      #
      # ONE SESSION CANNOT FUZZ THREE ARTIFACTS ON THIS RUNNER. `Fuzz.start` spawns a
      # worker per artifact through `Io.Group.async`, and the build runner's `Io.Threaded`
      # defaults `async_limit` to `cpu_count - 1` -- one slot already held by the coverage
      # task. A fuzz worker never returns, so an N-core box only ever starts N-2 of them.
      # ubuntu-latest is 4 cores and this tree has 3 roots, so one artifact would never
      # begin and would leave no coverage file at all -- reproducible on any box with
      # `taskset -c 0-3`. Per-target steps make each a single-worker session, so the slot
      # arithmetic cannot starve any of them.
      #
      # READ THE OUTPUT FOR THE CRASH, NEVER THE EXIT CODE. `zig build --fuzz` does not stop
      # when a target crashes: it reports the failing test, saves the reproducing input, and
      # keeps fuzzing, so the SIGINT at the sub-budget is still what sets the status and the
      # run exits 130 exactly as a clean one does. This lane shipped the opposite claim and
      # printed "no crash found" over a genuine out-of-bounds the fuzzer had just found
      # (2026-08-04, fuzz-tb-probe, probe_index.mapScoreDtz); only the execution-counter gate
      # below went red, and only because the crash had stopped that target early -- a crash
      # late in a budget would have cleared the floor and reported the night clean. So grep
      # for the fuzzer's own crash line, which it prints when it saves the input.
      #
      # An interrupt with no crash line is the PASS: no bug in that window. A fresh corpus
      # each night finds shallow regressions; corpus persistence for depth is a later
      # enhancement.
      - name: Fuzz (bounded, ~5 min per target, ReleaseSafe)
        run: |
          set +e
          rc=0
          for step in fuzz-board fuzz-tb fuzz-tb-probe; do
            log="$RUNNER_TEMP/$step.log"
            timeout --preserve-status --signal=INT 300 \
              zig build "$step" --fuzz -Darch=x86-64-sse41-popcnt -Doptimize=ReleaseSafe 2>&1 | tee "$log"
            ec=${PIPESTATUS[0]}
            if grep -q "input saved to '" "$log"; then
              echo "fuzz: $step FOUND A CRASH -- safety-check trace and reproducing input above" >&2
              rc=1
              continue
            fi
            if [ "$ec" -ne 130 ] && [ "$ec" -ne 0 ]; then
              echo "fuzz: $step -- the fuzzer errored (exit $ec)" >&2
              rc="$ec"
              continue
            fi
            echo "fuzz: $step -- no crash found in its ~5 min budget (exit $ec)"
          done
          exit "$rc"

      # THE STEP ABOVE CANNOT DISTINGUISH "found nothing" FROM "fuzzed nothing".
      # It exits 0 on the SIGINT whether the fuzzer executed half a billion inputs or
      # three, and the Zig fuzzer prints no total, so an idle lane reads exactly like a
      # clean one. The sibling port shipped that failure live -- its search fuzzer was
      # managing three inputs per ninety seconds behind a green lane (mcfish 05914e99).
      # Read the execution counters the fuzzer keeps in .zig-cache/v and require ALL THREE
      # artifacts -- the board/eval/search targets, the Syzygy file parse as units, and the
      # same parse driven through a probe -- to have executed at least a million inputs
      # each. Expect the artifact count, never a smaller number -- a quota short of the root
      # count lets a target go dark and still clear the gate; move it when a root lands.
      # Measured locally, one 60s solo session per target: 13.2M (probe, the slowest),
      # 14.7M and 52.7M. A 300s budget clears the floor by orders of magnitude; this fires
      # on a broken lane, not a slow runner.
      - name: Assert the fuzzer actually executed
        run: zig run tools/fuzz_report.zig -- .zig-cache check /tmp/fuzz-baseline.txt 1000000 3

  # The board targets above never feed the COMMAND LOOP hostile input; this job
  # does, with tools/uci_fuzz.py against a ReleaseSafe build for a bounded budget.
  # The seed defaults to the wall clock, so successive nights walk fresh input
  # space; the harness prints it first, so a red run names its one-flag
  # reproducer at the top of the log.
  uci-fuzz:
    name: UCI command-loop fuzz (bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Cache NNUE network
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/nn-*.nnue
          key: nnue-${{ hashFiles('src/engine/eval/network.zig') }}
      - name: Fetch the NNUE net
        run: zig build net

      # pyproject.toml declares requires-python >= 3.14; run the harness on what
      # it declares, not on whatever python3 the runner image ships.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build (ReleaseSafe)
        run: zig build -Darch=x86-64-sse41-popcnt -Doptimize=ReleaseSafe

      # ~10 min of streams; the harness bounds every stream itself (verbatim
      # closing quit + a per-stream timeout), so no outer timeout wrapper.
      - name: Fuzz the UCI loop (bounded, ~10 min)
        working-directory: resources
        run: python3 ../tools/uci_fuzz.py --seconds 600
