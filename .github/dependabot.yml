version: 2
# Every action is named by its release tag, and .github/workflows/actions.lock
# names the commit that tag resolves to; Dependabot moves the tag and writes the
# lock entry in the same pull request. It waits seven days after a release
# before proposing it, so a version pulled or compromised in its first week
# never reaches a pull request; zizmor's `dependabot-cooldown` audit reads this.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # uv.lock's docs group, which builds the site.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
